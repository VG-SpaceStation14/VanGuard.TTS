<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VanGuard TTS — Терминал синтеза речи</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #111111;
            --surface: #1c1c1c;
            --surface-hover: #242424;
            --border: #333333;
            --text: #eeeeee;
            --muted: #999999;
            --accent: #e8693a;
            --accent-hover: #f07a4a;
            --cut-size: 12px;
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 0%, #1a1a2e 0%, var(--bg) 70%);
            color: var(--text);
            font: 14px/1.6 var(--font-sans);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Срезанные углы */
        .sliced-wrapper {
            background: var(--border);
            clip-path: polygon(
                var(--cut-size) 0,
                100% 0,
                100% calc(100% - var(--cut-size)),
                calc(100% - var(--cut-size)) 100%,
                0 100%,
                0 var(--cut-size)
            );
            padding: 1px;
            width: 100%;
            max-width: 640px;
        }

        .sliced-inner {
            background: var(--surface);
            clip-path: polygon(
                calc(var(--cut-size) - 1px) 0,
                100% 0,
                100% calc(100% - var(--cut-size) + 1px),
                calc(var(--cut-size) - 1px) 100%,
                0 100%,
                0 calc(var(--cut-size) - 1px)
            );
            padding: 32px;
        }

        h1 {
            font-family: var(--font-mono);
            font-size: 24px;
            font-weight: 500;
            margin: 0 0 8px 0;
            color: var(--text);
            letter-spacing: 1px;
        }

        h1 span {
            color: var(--accent);
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 32px;
            font-family: var(--font-mono);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea, input, select {
            width: 100%;
            background: #151515;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            font-family: var(--font-sans);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus, input:focus, select:focus {
            border-color: var(--accent);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 14px 24px;
            transition: all 0.2s;
            cursor: pointer;
            font-family: var(--font-mono);
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: var(--surface-hover);
            border-color: #555;
        }

        .btn-primary {
            background: var(--accent);
            color: #111;
            border-color: var(--accent);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            box-shadow: 0 0 15px rgba(232, 105, 58, 0.3);
        }

        .btn:disabled {
            background: #333;
            color: #777;
            border-color: #333;
            cursor: not-allowed;
            box-shadow: none;
        }

        audio {
            width: 100%;
            margin-top: 24px;
            display: none;
            filter: invert(1) hue-rotate(180deg); /* Делает стандартный плеер темным */
        }

        .status {
            margin-top: 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            text-align: center;
            min-height: 20px;
        }

        .status.success { color: #72d47d; }
        .status.error { color: #d67272; }
        .status.info { color: var(--muted); }

        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: #666;
            font-family: var(--font-mono);
        }

        .footer a {
            color: var(--muted);
            text-decoration: none;
        }

        .footer a:hover {
            color: var(--accent);
        }

        @media (max-width: 600px) {
            .row { grid-template-columns: 1fr; }
            .sliced-inner { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="sliced-wrapper">
        <div class="sliced-inner">
            <h1>VANGUARD <span>TTS</span></h1>
            <div class="subtitle">Терминал синтеза речи // Silero V5</div>

            <div class="form-group">
                <label for="textInput">Текст для озвучки</label>
                <textarea id="textInput" placeholder="Введите текст...">Привет, это тестовый голос!</textarea>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="speakerSelect">Голос</label>
                    <select id="speakerSelect">
                        <option value="">Загрузка...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="effectSelect">Эффект</label>
                    <select id="effectSelect">
                        <option value="">Нет</option>
                        <option value="Echo">Эхо</option>
                        <option value="Radio">Рация</option>
                        <option value="Robot">Робот</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="apiTokenInput">Токен доступа</label>
                <input type="password" id="apiTokenInput" placeholder="test" value="test">
            </div>

            <button id="generateBtn" class="btn btn-primary" onclick="generateTTS()">Сгенерировать</button>

            <div id="status" class="status info">Загрузка голосов...</div>

            <audio id="audioPlayer" controls></audio>

            <div class="footer">
                <a href="https://github.com/VG-SpaceStation14/VanGuard.TTS" target="_blank">VanGuard.TTS Repository</a>
            </div>
        </div>
    </div>

    <script>
        let availableVoices = [];
        const audioPlayer = document.getElementById('audioPlayer');
        const statusEl = document.getElementById('status');
        const generateBtn = document.getElementById('generateBtn');

        function formatVoiceName(voice) {
            // Красиво форматируем имена (убираем ru_ и делаем заглавную)
            let name = voice.replace('ru_', '');
            name = name.charAt(0).toUpperCase() + name.slice(1);
            return name;
        }

        function showStatus(message, type = 'info') {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        async function loadVoices() {
            const select = document.getElementById('speakerSelect');
            showStatus('Загрузка списка голосов...', 'info');
            
            try {
                const res = await fetch('/voices');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                availableVoices = await res.json();
                select.innerHTML = '<option value="">Выберите голос</option>';
                
                // Сортируем по алфавиту
                availableVoices.sort().forEach(voice => {
                    const opt = document.createElement('option');
                    opt.value = voice;
                    opt.textContent = formatVoiceName(voice);
                    select.appendChild(opt);
                });
                
                showStatus(`Загружено голосов: ${availableVoices.length}`, 'success');
            } catch (err) {
                console.error(err);
                showStatus('Ошибка загрузки голосов: ' + err.message, 'error');
                select.innerHTML = '<option value="ru_alexandr">Alexandr</option>';
            }
        }

        async function generateTTS() {
            const text = document.getElementById('textInput').value;
            const speaker = document.getElementById('speakerSelect').value;
            const effect = document.getElementById('effectSelect').value;
            const api_token = document.getElementById('apiTokenInput').value;
            
            if (!text) {
                showStatus('Введите текст!', 'error');
                return;
            }
            if (!api_token) {
                showStatus('Введите API токен!', 'error');
                return;
            }

            generateBtn.disabled = true;
            generateBtn.textContent = 'Генерация...';
            showStatus('Синтез речи...', 'info');
            audioPlayer.style.display = 'none';

            try {
                const response = await fetch('/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text,
                        speaker,
                        api_token,
                        effect,
                        format: 'ogg',
                        sample_rate: 24000,
                        put_accent: false,
                        put_yo: false
                    })
                });
                
                if (!response.ok) {
                    let errorMessage = 'Неизвестная ошибка';
                    try {
                        const errData = await response.json();
                        errorMessage = errData.description || errData.error || errorMessage;
                    } catch {
                        errorMessage = await response.text() || errorMessage;
                    }
                    throw new Error(`Сервер: ${errorMessage}`);
                }
                
                const json = await response.json();
                if (!json || !json.results || json.results.length === 0) {
                    throw new Error('Пустой аудиофайл');
                }
                
                const url = URL.createObjectURL(base64ToBlob(json.results[0].audio, 'audio/ogg'));
                
                if (audioPlayer.src) {
                    URL.revokeObjectURL(audioPlayer.src);
                }
                
                audioPlayer.src = url;
                audioPlayer.style.display = 'block';
                audioPlayer.play().catch(() => showStatus('Нажмите Play для воспроизведения', 'info'));
                
                showStatus('Аудио готово!', 'success');
                
            } catch (err) {
                console.error('TTS Error:', err);
                showStatus('Ошибка: ' + err.message, 'error');
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Сгенерировать';
            }
        }

        function base64ToBlob(base64, mimeType) {
            const byteChars = atob(base64);
            const byteArrays = [];
            for (let i = 0; i < byteChars.length; i++) {
                byteArrays.push(byteChars.charCodeAt(i));
            }
            return new Blob([new Uint8Array(byteArrays)], { type: mimeType });
        }

        window.onload = () => {
            loadVoices();
        };
    </script>
</body>
</html>
